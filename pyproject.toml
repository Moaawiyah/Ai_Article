[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-ai"
version = "1.0.0"
description = "AI Agents HW2 — document processing pipeline using markitdown and LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "moaawiyahhaj", email = "moaawiyah.haj@gmail.com" }]
dependencies = [
    "anthropic>=0.40.0",
    "crewai[litellm]>=0.100.0",
    "markitdown[pdf]>=0.1.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
agent-ai         = "agent_ai.sdk.sdk:main"
agent-ai-article = "agent_ai.main:main"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/agent_ai/main.py",
    "src/agent_ai/pipeline.py",
    "src/agent_ai/pipeline_steps.py",
    "src/agent_ai/agents/*",
    "src/agent_ai/tasks/*",
    "src/agent_ai/utils/graph_generator.py",
    "src/agent_ai/utils/graph_spec.py",
    "src/agent_ai/utils/logger.py",
    "*/tests/*",
    "src/**/gui/*",
]

[tool.coverage.report]
fail_under = 85
