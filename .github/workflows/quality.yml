name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --locked
      - name: Ruff
        run: uv run ruff check src tests
      - name: Tests and full-source coverage
        run: uv run pytest
